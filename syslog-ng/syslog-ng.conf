@version: 4.10
@include "scl.conf"

options {
  chain_hostnames(no);
  keep_hostname(yes);
  use_dns(no);
  create_dirs(yes);
  flush_lines(1);
  log_fifo_size(20000);
  stats(freq(0));
};

source s_net {
  udp(ip("0.0.0.0") port(514));
};

# The source address goes into the file name: a sender is the header host,
# the address the packet came from and the vendor's serial in the message,
# and the collector reads the address from the path (modules/parsers/sender.py).
# A FortiGate writes no header hostname, so ${HOST} is its address there.
destination d_file {
  file("/var/log/syslog-ng/${HOST}_${SOURCEIP}_${YEAR}-${MONTH}-${DAY}.log");
};

log {
  source(s_net);
  destination(d_file);
};
